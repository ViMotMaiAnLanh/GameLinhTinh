<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Linh Tinh - Party Games</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <!-- MÀN HÌNH 1: NHẬP TÊN VÀ TẠO/VÀO PHÒNG -->
        <div id="login-screen" class="card">
            <h1>🎮 Game Linh Tinh</h1>
            <div class="input-group">
                <label for="player-name">Tên của bạn:</label>
                <input type="text" id="player-name" placeholder="Nhập tên..." maxlength="12">
            </div>
            <div class="input-group">
                <label for="room-id">Mã Phòng:</label>
                <input type="text" id="room-id" placeholder="Nhập mã phòng (VD: 1234)...">
            </div>
            <button id="btn-join" class="btn primary-btn">Vào / Tạo Phòng</button>
            <div style="margin-top: 15px; text-align: center;">
                <img src="qr-code.png" alt="Mã QR" style="width: 120px; border-radius: 8px;">
            </div>
        </div>

        <!-- MÀN HÌNH 2: SẢNH CHỜ (LOBBY) -->
        <div id="lobby-screen" class="card hidden">
            <h2>Sảnh Chờ - Phòng: <span id="display-room-id"></span></h2>
            <div class="player-list-box">
                <h3>Danh sách người chơi (<span id="player-count">0</span>/12):</h3>
                <ul id="player-list"></ul>
            </div>

            <!-- CHỈ CHỦ PHÒNG MỚI THẤY KHU VỰC CHỌN GAME -->
            <div id="host-controls" class="hidden" style="margin-top: 20px;">
                <h3>Chọn trò chơi:</h3>
                <button class="btn game-btn" onclick="selectGame('masoi')">🐺 Ma Sói (6 - 12 người)</button>
                <button class="btn game-btn disabled" disabled>🎮 Game 2 (Sắp ra mắt)</button>
            </div>
            <p id="waiting-msg" style="margin-top: 15px; color: #888;">Đang chờ chủ phòng chọn game...</p>
        </div>

        <!-- MÀN HÌNH 3: GAME 1 - MA SÓI -->
        <div id="game-masoi-screen" class="card hidden">
            <!-- Thẻ bài chức năng -->
            <div class="role-card-container">
                <img id="role-img" src="" alt="Lá bài chức năng" class="role-img">
                <div class="role-info">
                    <h2 id="role-title">Tên chức vụ</h2>
                    <p id="role-desc">Hướng dẫn chức năng...</p>
                </div>
            </div>

            <!-- Khu vực hành động ban đêm / ban ngày -->
            <div id="action-box" class="action-box hidden">
                <h3 id="action-title">Lượt của bạn</h3>
                <div id="target-selector" class="target-grid"></div>
                <button id="btn-action-confirm" class="btn primary-btn hidden">Xác nhận</button>
            </div>

            <!-- Nút Hoàn thành lượt / Bắt đầu đêm -->
            <div class="bottom-actions">
                <button id="btn-start-first-night" class="btn success-btn">Bắt đầu đêm đầu tiên</button>
                <button id="btn-finish-turn" class="btn primary-btn hidden">Hoàn thành lượt</button>
                <button id="btn-start-next-night" class="btn primary-btn hidden">Bắt đầu đêm</button>
            </div>
        </div>
    </div>

    <!-- File âm thanh -->
    <audio id="audio-sang" src="Sáng.mp3" preload="auto"></audio>

    <!-- Script kết nối -->
    <script src="js/main.js"></script>
    <script src="js/game1.js"></script>
</body>
</html>
